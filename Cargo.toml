[workspace]
resolver = "2"
members = [
    "crates/orchestrator",
    "crates/crosslink_api",
    "crates/crossbridge_api",
    "crates/jj_api",
    "crates/zellij_host",
    "crates/error",
    "crates/xtask",
]
# `.crosslink-src` is the bootstrap-managed copy of the pinned crosslink source
# (see `just bootstrap`). It sits inside the workspace directory, so without
# this exclude cargo would adopt the `crosslink` path dependency as an implicit
# workspace member — building and linting crosslink's own code. It must stay a
# plain dependency.
# `.crossbridge-src` is the bootstrap-managed copy of the pinned crossbridge
# source (github.com/vringar/crossbridge; see `just bootstrap`). The
# `crossbridge_api` insulation crate path-depends on its `crossbridge-server`
# and `crossbridge-protocol` crates; excluding it keeps cargo from adopting
# crossbridge's own workspace as vetinari workspace members. Its crosslink
# git-dependency is collapsed onto vetinari's single crosslink copy by the
# `[patch]` below (the `links = "sqlite3"` single-copy constraint, AC-28a).
# `tests/fixtures/hello` is the dogfood fixture crate (AC-11a). It is copied
# into a temp dir and built there by the build_fixture() test helper; excluding
# it keeps `cargo build --workspace` from adopting it as a member.
exclude = [".crosslink-src", ".crossbridge-src", "tests/fixtures/hello"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vringar/vetinari"

[workspace.dependencies]
miette = { version = "7.2", features = ["fancy"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# jj-lib's API is async-heavy; the jj_api insulation crate presents a
# synchronous surface to the orchestrator by driving futures to completion on
# the current thread (pollster) — no tokio runtime is pulled into the binary.
pollster = "0.4"
futures = "0.3"
tempfile = "3"
# Only the `clock` feature is needed: jj-lib's revset parser requires a
# `DatePatternContext` built from a `chrono` timestamp. The 0.4 requirement
# unifies with the `chrono` jj-lib itself pulls in.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# jj-lib's diff API hands back `bstr` byte-string types; the 1.x requirement
# unifies with the `bstr` jj-lib pulls in.
bstr = "1.12"
# Short unique suffixes for per-worker workspace names (REQ-12). Only the `v4`
# generator is needed; the version unifies with the `uuid` jj-lib already pulls
# in so the whole graph resolves to one copy.
uuid = { version = "1", features = ["v4"] }

# jj-lib is resolved from the pinned jujutsu source tree, not crates.io: the
# `[patch.crates-io]` block in the generated `.cargo/config.toml` (see
# `just bootstrap`) redirects it to `$JJ_SRC/lib`. The version requirement
# here must match the pinned jujutsu; a mismatch surfaces as a hard cargo
# error, which is the intended signal to file a pin-bump issue (REQ-1c).
jj-lib = "0.41.0"

# Internal crates
vetinari-error = { path = "crates/error" }
vetinari-crosslink-api = { path = "crates/crosslink_api" }
vetinari-crossbridge-api = { path = "crates/crossbridge_api" }
vetinari-jj-api = { path = "crates/jj_api" }
vetinari-zellij-host = { path = "crates/zellij_host" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = 1

# Collapse crossbridge's crosslink onto vetinari's single pinned crosslink copy
# (REQ-20b, AC-28a). crossbridge's own `Cargo.toml` git-depends on crosslink at
# `Corvidae-Coding-Projects/crosslink@e7b6ad8` (crosslink 0.9.0-beta.1); this
# `[patch]` redirects that git source to the same `.crosslink-src/crosslink`
# tree that `crosslink_api` path-depends on and that `just bootstrap` populates
# from the npins pin (currently dbbe2ed3, also crosslink 0.9.0-beta.1).
#
# Why a patch and not coexistence: crosslink pulls `libsqlite3-sys`
# (`links = "sqlite3"`), and cargo forbids two packages sharing a `links` value
# — so the whole dependency graph must resolve to exactly ONE crosslink. This
# patch is what makes that true; the `xtask check-crosslink` guard (AC-28a)
# fails the build if a future crosslink-rev divergence ever reintroduces a
# second copy.
#
# Placement: this git-source patch lives in the workspace `Cargo.toml` (not the
# bootstrap-generated `.cargo/config.toml`, which only manages the crates.io
# `jj-lib` patch). The path is relative to the workspace root.
[patch."https://github.com/Corvidae-Coding-Projects/crosslink.git"]
crosslink = { path = ".crosslink-src/crosslink" }

[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Repo-local maintenance helper. The `lint` subcommand is the no-shell-out hard
# lint (AC-24, REQ-1a): a build-failing CI gate. It parses orchestrator-side
# crates with `syn` rather than grepping, so comments and doc strings can never
# false-positive and `#[cfg(test)]` code can be exempted precisely.

[dependencies]
syn = { version = "2.0", features = ["full", "visit"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
# `check-crosslink` (AC-28a) parses `cargo metadata` JSON to assert exactly one
# crosslink resolves in the graph. xtask is exempt from the AC-24 no-shell-out
# audit, so it may invoke `cargo` directly.
serde_json = { workspace = true }

[[bin]]
name = "xtask"
path = "src/main.rs"

[package]
name = "vetinari-crosslink-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Insulation layer between the orchestrator and crosslink's Rust crates
# (REQ-3a). All crosslink API churn is contained to this crate: the rest of the
# orchestrator depends only on the stable adapter surface and the self-contained
# `CrosslinkError` defined here, never on crosslink types directly.

[dependencies]
miette = { workspace = true }
thiserror = { workspace = true }
# Parse crosslink's `.crosslink/hook-config*.json` config files to read the
# `tracker_remote` key (REQ-17 mode gate). crosslink's own layered-config reader
# lives under its private `commands` module (not re-exported from its lib), so
# the adapter reads the JSON directly.
serde_json = { workspace = true }
# The crosslink library crate. crosslink is not published to crates.io, so it
# is a path dependency through the `.crosslink-src` tree that `just bootstrap`
# copies from the npins-pinned crosslink source (see the workspace justfile and
# shell.nix). Bump via `npins update crosslink`.
crosslink = { path = "../../.crosslink-src/crosslink" }

[dev-dependencies]
# The integration test builds a throwaway crosslink repository on disk; an
# integration test is a separate crate, so it redeclares these.
crosslink = { path = "../../.crosslink-src/crosslink" }
tempfile = { workspace = true }

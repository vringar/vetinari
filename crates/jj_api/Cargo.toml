[package]
name = "vetinari-jj-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Insulation layer between the orchestrator and jj-lib (REQ-1c). All jj-lib API
# churn is contained to this crate: the rest of the orchestrator depends only
# on the stable adapter surface and the self-contained `JjError` defined here,
# never on jj-lib types directly.

[dependencies]
miette = { workspace = true }
thiserror = { workspace = true }
# Resolved to the pinned jujutsu source via `.cargo/config.toml` (see the
# workspace manifest and `just bootstrap`).
jj-lib = { workspace = true }
# jj-lib operations are `async`; pollster drives them on the current thread so
# the adapter surface stays synchronous (REQ-1a — no tokio in the orchestrator).
pollster = { workspace = true }
# Stream/TryStream adapters for revset and tree-diff iteration.
futures = { workspace = true }
# Supplies the timestamp jj-lib's revset parser needs (DatePatternContext).
chrono = { workspace = true }
# Byte-string types that appear in jj-lib's diff API.
bstr = { workspace = true }

[dev-dependencies]
# AC-25 integration test builds a throwaway repository on disk. An integration
# test is a separate crate, so the deps it shares with the adapter — used here
# only to construct the fixture repository — must be redeclared.
tempfile = { workspace = true }
jj-lib = { workspace = true }
pollster = { workspace = true }

[package]
name = "orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vetinari-error.workspace = true
vetinari-crosslink-api.workspace = true
vetinari-jj-api.workspace = true
vetinari-zellij-host.workspace = true
# The first orchestrator → crossbridge_api dependency (spec §1.2, §1.4, step 4):
# the embedded crossbridge server is started from `main.rs` through this
# insulation crate's plain-typed `serve`/`own_slug` surface, so the orchestrator
# core stays synchronous and tokio-free and never links a `crossbridge-*` crate
# directly (the sync/async + trust membrane lives entirely in `crossbridge_api`).
# The server is OFF unless `[crossbridge] enabled = true`; a default build starts
# nothing.
vetinari-crossbridge-api.workspace = true
miette = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = "1.0"
# `bundled` compiles a vendored SQLite into the binary: the orchestrator's
# state.db schema is then independent of whatever libsqlite3 the host carries
# (REQ-2). rusqlite's synchronous API matches the single-threaded tick loop —
# no async runtime is pulled in. The version MUST track the `rusqlite` that the
# pinned `crosslink` source depends on: `libsqlite3-sys` carries `links =
# "sqlite3"`, so the whole dependency graph must resolve to one copy. A version
# mismatch surfaces as a hard cargo `links` conflict — the signal to re-align.
rusqlite = { version = "0.38", features = ["bundled"] }
# Short unique suffixes for per-worker workspace names (REQ-12, workspace.rs).
uuid = { workspace = true }
# SHA-256 for the DONE-sentinel artifact verification (REQ-3b, artifacts.rs):
# the worker lists each artifact's `sha256sum` in `_orchestrator/DONE`, and a
# `DoneSentinel` can only be constructed after recomputing every digest and
# confirming it matches. Pure-Rust; no `Command::new` shell-out (AC-24). Pinned
# to 0.10 to unify with the `sha2 0.10.x` already in the dependency graph
# (transitively via the pinned crosslink/jj-lib trees) so `digest` resolves to
# one copy.
sha2 = "0.10"
# `.orchestrator/config.toml` parsing (REQ-13, config.rs). Pure-Rust TOML; the
# 0.8 requirement unifies with the `toml 0.8.x` already in the dependency graph
# (transitively via the pinned crosslink tree) so it resolves to one copy.
toml = "0.8"
# GitHub PR creation for remote-mode landing (REQ-17, REQ-1a): the AC-24 lint
# forbids a `gh` subprocess, so PRs are opened through octocrab's typed client.
# Default features pull in the `rustls` TLS stack, unifying with the `rustls` /
# `hyper-rustls` already in the graph (transitively via crosslink's reqwest) so
# no second (native-tls/openssl) TLS backend is linked.
octocrab = "0.54"
# octocrab's client is async over hyper; the synchronous landing machine drives
# a single PR-create future to completion on a current-thread runtime (no async
# runtime is threaded through the rest of the orchestrator). Only the runtime +
# IO/time drivers are needed.
tokio = { version = "1", features = ["rt", "net", "time"] }

[dev-dependencies]
tempfile = { workspace = true }
# The `vetinari` CLI's graph/crossbridge integration tests build a throwaway
# crosslink repository on disk directly via the library (issues, blockers,
# labels), mirroring `crosslink_api`'s own adapter test — no jj/crosslink CLI
# shell-out. Same pinned source already in the graph (via `crosslink_api`), so
# it resolves to one `crosslink` (no `links` conflict).
crosslink = { path = "../../.crosslink-src/crosslink" }
# Property-based tests for the workspace-name scheme (round-trip, collision-
# freedom, filesystem-safety) and idempotent-cleanup observational equivalence.
# `kani` is unavailable in the dev shell, so proptest is the proof tool.
proptest = "1"
# Cross-process advisory `flock(2)` for the shared zellij test lockfile
# (tests/common/mod.rs): the `zellij` CLI shares one per-user server across
# concurrently-run test binaries, so a per-process Mutex cannot serialize them.
# Already resolved in the lockfile transitively; no new download. Pinned to 0.2
# to unify with the existing `libc 0.2.x` in the dependency graph.
libc = "0.2"

[[bin]]
name = "orchestrator"
path = "src/main.rs"

# The read-only introspection CLI for the VDD section chief
# (`.design/swarm-kickoff-spec.md` §2.2). A second, deliberately thin binary:
# it opens `state.db` read-only + crosslink for the DAG and NEVER writes, so the
# single-writer invariant (REQ-3) holds. Second bin (not a subcommand) reads
# cleaner for the `vetinari` skill and the zellij pane title.
[[bin]]
name = "vetinari"
path = "src/bin/vetinari.rs"

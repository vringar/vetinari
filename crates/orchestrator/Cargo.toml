[package]
name = "orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vetinari-error.workspace = true
vetinari-crosslink-api.workspace = true
vetinari-jj-api.workspace = true
vetinari-zellij-host.workspace = true
miette = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = "1.0"
# `bundled` compiles a vendored SQLite into the binary: the orchestrator's
# state.db schema is then independent of whatever libsqlite3 the host carries
# (REQ-2). rusqlite's synchronous API matches the single-threaded tick loop —
# no async runtime is pulled in. The version MUST track the `rusqlite` that the
# pinned `crosslink` source depends on: `libsqlite3-sys` carries `links =
# "sqlite3"`, so the whole dependency graph must resolve to one copy. A version
# mismatch surfaces as a hard cargo `links` conflict — the signal to re-align.
rusqlite = { version = "0.38", features = ["bundled"] }
# Short unique suffixes for per-worker workspace names (REQ-12, workspace.rs).
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Property-based tests for the workspace-name scheme (round-trip, collision-
# freedom, filesystem-safety) and idempotent-cleanup observational equivalence.
# `kani` is unavailable in the dev shell, so proptest is the proof tool.
proptest = "1"

[[bin]]
name = "orchestrator"
path = "src/main.rs"
